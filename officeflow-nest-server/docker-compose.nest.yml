services:
  mysql:
    image: mysql:8.4
    container_name: officeflow_nest_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-officeflow_helpdesk}
      MYSQL_USER: ${MYSQL_USER:-officeflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3307:3306"
    volumes:
      - officeflow_nest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  nest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officeflow_nest_api
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: ${PORT:-5001}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  officeflow_nest_mysql_data:
