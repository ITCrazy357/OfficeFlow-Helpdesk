# Copy to secrets/alertmanager.yml; configure an owned receiver before use.
# This example intentionally has no remote destination. Alerts appear in the UI only.
route:
  receiver: local-review
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-review
