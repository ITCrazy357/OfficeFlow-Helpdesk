global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: officeflow-api
    metrics_path: /api/metrics
    scrape_timeout: 5s
    # Local Docker Desktop -> host backend only. Use HTTPS/private discovery in production.
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:5001]
