name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "officeflow-client/**"
      - ".github/workflows/frontend-ci.yml"
      - "scripts/prototype-safety.test.cjs"
      - "scripts/legacy-matcher.test.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: officeflow-client
    env:
      NEXT_PUBLIC_API_URL: /backend-api
      API_PROXY_TARGET: http://127.0.0.1:5001/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: officeflow-client/package-lock.json
      - name: Use the npm version pinned by the Docker image
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Audit all locked dependencies including development tools
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Prototype safety for development tools
        run: npm run test:prototype-safety
      - name: Type check
        run: |
          npx --no-install next typegen
          npx --no-install tsc --noEmit
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
