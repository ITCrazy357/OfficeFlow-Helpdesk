name: Backend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "officeflow-nest-server/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: officeflow_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: officeflow-nest-server

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/officeflow_ci
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-bytes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: officeflow-nest-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify migrations on clean database
        run: npm run migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build:ci

  deploy:
    name: Deploy Backend to Render
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Trigger Render deploy for verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          separator='?'
          case "${RENDER_DEPLOY_HOOK_URL}" in
            *\?*) separator='&' ;;
          esac

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"

      - name: Wait for the verified commit to become healthy
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_HEALTH_URL}" ]; then
            echo "::error::Missing BACKEND_HEALTH_URL production variable"
            exit 1
          fi

          response_file="${RUNNER_TEMP}/backend-health.json"
          deadline=$((SECONDS + 900))

          while [ "${SECONDS}" -lt "${deadline}" ]; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${response_file}" \
              "${BACKEND_HEALTH_URL}"; then
              deployed_commit="$(node -e '
                const fs = require("node:fs");
                const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(body?.data?.version ?? body?.version ?? "");
              ' "${response_file}" 2>/dev/null || true)"

              if [ "${deployed_commit}" = "${GITHUB_SHA}" ]; then
                echo "Production is healthy on commit ${GITHUB_SHA}"
                echo "### Backend production deployment" >> "${GITHUB_STEP_SUMMARY}"
                echo "- Commit: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
                echo "- Database health check: passed" >> "${GITHUB_STEP_SUMMARY}"
                exit 0
              fi

              echo "Render is currently serving ${deployed_commit:-an unknown commit}; waiting for ${GITHUB_SHA}"
            else
              echo "Production health check is not ready yet"
            fi

            sleep 10
          done

          echo "::error::Render did not serve healthy commit ${GITHUB_SHA} within 15 minutes"
          exit 1
