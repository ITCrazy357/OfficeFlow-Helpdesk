name: Backend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "officeflow-nest-server/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: officeflow_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: officeflow-nest-server

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/officeflow_ci
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-bytes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: officeflow-nest-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify migrations on clean database
        run: npm run migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage gate
        run: npm run test:cov -- --runInBand

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: officeflow-nest-server/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build:ci

      - name: Native metrics HTTP and module wiring tests
        run: node --test test/metrics.http.test.cjs

      - name: Test isolation safety checks
        run: npm run test:integration:safety

      - name: Real MySQL and Redis integration tests (disposable isolated project)
        run: npm run test:integration

  security:
    name: Backend security and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit locked production dependencies
        working-directory: officeflow-nest-server
        run: npm audit --omit=dev --audit-level=high
      - name: Scan all Git history for secrets (redacted output)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --log-opts="--all" --exit-code=1
      - name: Build backend image locally; do not push
        run: docker build -t officeflow-backend:ci officeflow-nest-server
      - name: Scan image OS and libraries
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: officeflow-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Validate and test Prometheus alert rules
        working-directory: officeflow-nest-server/monitoring
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/work:ro" -w /work prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/work:ro" -w /work prom/prometheus:v3.5.0 test rules alerts.test.yml
      - name: Validate Alertmanager example (no external receiver)
        working-directory: officeflow-nest-server/monitoring
        run: >-
          docker run --rm --entrypoint /bin/amtool -v "$PWD:/work:ro"
          prom/alertmanager:v0.28.1 check-config /work/alertmanager.example.yml

  deploy:
    name: Deploy Backend to Render
    needs: [verify, security]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Trigger Render deploy for verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          separator='?'
          case "${RENDER_DEPLOY_HOOK_URL}" in
            *\?*) separator='&' ;;
          esac

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"

      - name: Wait for the verified commit to become healthy
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_HEALTH_URL}" ]; then
            echo "::error::Missing BACKEND_HEALTH_URL production variable"
            exit 1
          fi

          response_file="${RUNNER_TEMP}/backend-health.json"
          deadline=$((SECONDS + 900))

          while [ "${SECONDS}" -lt "${deadline}" ]; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "${response_file}" \
              "${BACKEND_HEALTH_URL}"; then
              deployed_commit="$(node -e '
                const fs = require("node:fs");
                const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(body?.data?.version ?? body?.version ?? "");
              ' "${response_file}" 2>/dev/null || true)"

              if [ "${deployed_commit}" = "${GITHUB_SHA}" ]; then
                echo "Production is healthy on commit ${GITHUB_SHA}"
                echo "### Backend production deployment" >> "${GITHUB_STEP_SUMMARY}"
                echo "- Commit: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
                echo "- Database health check: passed" >> "${GITHUB_STEP_SUMMARY}"
                exit 0
              fi

              echo "Render is currently serving ${deployed_commit:-an unknown commit}; waiting for ${GITHUB_SHA}"
            else
              echo "Production health check is not ready yet"
            fi

            sleep 10
          done

          echo "::error::Render did not serve healthy commit ${GITHUB_SHA} within 15 minutes"
          exit 1
