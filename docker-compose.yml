services:
  mysql:
    image: mysql:8.4
    container_name: officeflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-officeflow_helpdesk}
      MYSQL_USER: ${MYSQL_USER:-officeflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3307:3306"
    volumes:
      - officeflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./officeflow-server
      dockerfile: Dockerfile
    container_name: officeflow_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: ${LEGACY_DATABASE_URL:?LEGACY_DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./officeflow-server/src:/app/src
      - ./officeflow-server/prisma:/app/prisma
    command: npm run dev

volumes:
  officeflow_mysql_data:
